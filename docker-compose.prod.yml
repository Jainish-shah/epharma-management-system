# Production-shaped stack: the app on gunicorn + PostgreSQL.
#
#   cp .env.example .env     # then edit .env — it MUST contain a real DJANGO_SECRET_KEY
#   docker compose -f docker-compose.prod.yml up -d --build
#
# TLS is expected to terminate in front of this (load balancer, or a reverse proxy such as Caddy or
# nginx). The app trusts X-Forwarded-Proto, so it knows the original request was HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epharma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-epharma}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epharma}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # don't boot the app before PostgreSQL accepts connections
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      # TLS terminates at the proxy in front of this stack, so the app itself doesn't redirect.
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-epharma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-epharma}
      EPHARMA_ENC_KEY: ${EPHARMA_ENC_KEY:?set EPHARMA_ENC_KEY in .env}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      NOTIFY_CHANNELS: ${NOTIFY_CHANNELS:-log}
      # Compose passes ONLY the variables listed here — a setting in .env that is missing from this
      # list is silently ignored inside the container. Everything the app reads is listed below.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Rate limiting. DJANGO_TRUST_PROXY must be 1 when a proxy sits in front (the usual case for
      # this stack), or every user arrives from the proxy's address and they all share ONE bucket.
      # It defaults to 0 because that is the safe failure: with 1 and no proxy, any client can forge
      # X-Forwarded-For and bypass the limit entirely.
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-0}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      RATE_LIMIT: ${RATE_LIMIT:-120}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      # Compliance (Phase 7): key rotation, consent version, retention windows.
      EPHARMA_ENC_KEY_OLD: ${EPHARMA_ENC_KEY_OLD:-}
      POLICY_VERSION: ${POLICY_VERSION:-1.0}
      RETAIN_OTPS_DAYS: ${RETAIN_OTPS_DAYS:-1}
      RETAIN_TOKENS_DAYS: ${RETAIN_TOKENS_DAYS:-30}
      RETAIN_NOTIFICATIONS_DAYS: ${RETAIN_NOTIFICATIONS_DAYS:-180}
      RETAIN_AUDIT_DAYS: ${RETAIN_AUDIT_DAYS:-365}
      REFILL_DAYS: ${REFILL_DAYS:-30}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
    ports:
      - "${WEB_PORT:-8000}:8000"

volumes:
  pgdata:
